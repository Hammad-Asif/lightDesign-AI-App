# Production stack: nginx (web) in front of FastAPI (api), with Postgres (db).
# Local development runs uvicorn and Vite directly — see README.
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightdesign}
      POSTGRES_USER: ${POSTGRES_USER:-lightdesign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lightdesign}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lightdesign}
      STORAGE_DIR: /srv/storage
    volumes:
      - photos:/srv/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  photos:
