[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roofline"
version = "0.1.0"
description = "Roof structure lines from a street-level photo: SAM 3 planes, hard partition, fitted lines, vanishing points, planar graph."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9"]

[tool.setuptools]
packages = ["roofline"]
